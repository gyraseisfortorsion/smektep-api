version: '1'

services:
  fastapi-app:
    platform: linux/amd64
    command: bash -c "uvicorn api:app --host 0.0.0.0 --port 8000 --reload"
    build: .
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          memory: 4g
   

